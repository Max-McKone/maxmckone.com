<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intro Course — maxmckone.com</title>
    <link rel="icon" href="../../images/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a0a;
            font-family: 'Inter', sans-serif;
            color: #fff;
        }
        .coming-soon {
            text-align: center;
            padding: 2rem;
        }
        .coming-soon h1 {
            font-size: clamp(2rem, 6vw, 4rem);
            font-weight: 300;
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-bottom: 1rem;
        }
        .coming-soon p {
            color: rgba(255,255,255,0.5);
            font-weight: 300;
            font-size: 1.1rem;
        }
        .back {
            display: inline-block;
            margin-top: 2rem;
            color: rgba(255,255,255,0.6);
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding-bottom: 2px;
            transition: color 0.2s;
        }
        .back:hover { color: #fff; }
    </style>
</head>
<body>
    <div class="coming-soon">
        <h1>Intro Course</h1>
        <p>Free content coming soon. Check back shortly.</p>
        <a href="/" class="back">← Back to maxmckone.com</a>

</html>
